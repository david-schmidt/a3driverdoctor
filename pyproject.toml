[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "a3driverdoctor"
version = "0.1.0"
description = "Apple III SOS device driver doctor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "diskii>=0.4.17",
]

[project.scripts]
a3dmd = "a3driverdoctor.a3dmd:main"

[tool.setuptools]
py-modules = ["a3dmd"]

[tool.setuptools.packages.find]
where = ["src"]