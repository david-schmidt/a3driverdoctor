name: Publish Python Package to PyPI

on:
  release:
    types: [published] # Triggers when you create a new GitHub Release

jobs:
  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/a3driverdoctor
    
    permissions:
      id-token: write # MANDATORY: Required for OIDC / Trusted Publishing
      contents: read  # Required to check out the repository code

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package distribution
        run: python -m build

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
